[package]
name = "wallpaper-overrider-rs"
version = "0.1.4"
edition = "2024"
description = "Override Windows wallpaper settings via registry policies"
authors = ["Vincent Gravade"]
license = "GPL-3.0-only"

[[bin]]
name = "wallpaper-overrider"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
winreg = "0.56"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

# "Hyper safe" clippy configuration: pedantic + nursery + restriction lints
# targeting memory safety / UB / silent bugs. The `warn` levels are
# turned into errors by the mandatory command `cargo clippy -- -D warnings`.
[lints.clippy]
# --- Groups (priority -1 so individual allow/warn settings take precedence) ---
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# --- Memory safety / UB (restriction) ---
transmuting_null = "warn"
multiple_unsafe_ops_per_block = "warn"
transmute_undefined_repr = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"

# --- Panic / abort behavior (panic = "abort" in release) ---
unwrap_used = "warn"
expect_used = "warn"
panic_in_result_fn = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_in_result = "warn"

# --- Coroutines / async ---
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
rc_mutex = "warn"

# --- Documentation / public API ---
missing_safety_doc = "warn"

# --- Various high-signal (restriction) ---
borrow_deref_ref = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mutex_integer = "warn"
pathbuf_init_then_push = "warn"
print_stderr = "warn"
print_stdout = "warn"
ref_binding_to_reference = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
unnecessary_join = "warn"
unnecessary_semicolon = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
wildcard_enum_match_arm = "warn"
zero_sized_map_values = "warn"
uninlined_format_args = "warn"

# --- Allowed lints: practical constraints of the project ---
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
